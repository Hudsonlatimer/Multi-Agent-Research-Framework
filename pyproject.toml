[project]
name = "research-team"
version = "0.1.0"
description = "Research reports that fail if the model invents a citation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hudsonlatimer" }]
keywords = ["langgraph", "agents", "research", "citations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",
    "langchain-together>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-ollama>=0.3.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
research = "research_team.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_team"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: calls a real model provider and spends quota",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
package = true
